# Проверка веток и PR: модульные и интеграционные тесты и стенд экранов на Linux.
#
# Работа уходит на GitHub ветками, а в master идет только перемоткой. Этот прогон дает
# серверное подтверждение: перед отправкой в master проверка ветки должна быть зеленой, а у PR
# результат виден прямо в PR.
#
# Интеграционные тесты и стенд здесь гоняются целиком: у программы одна SQLite и настоящие
# файлы, без внешних серверов, и оба набора укладываются в пару минут.
#
# Триггеры:
#   • push любой ветки, кроме master и ci: master получает уже проверенные коммиты, ci — ветка
#     полной проверки по команде (отдельный модуль); теги сюда не попадают — при одном фильтре
#     веток GitHub пуш тега не запускает;
#   • PR в master;
#   • кнопка на вкладке Actions.
#
# С выпуском релиза (тег v*, push master) и полной проверкой (ветка ci) не пересекается ни по
# триггерам, ни по файлам: удаляется вместе с docs/developer/guides/branch-tests.md, не задевая их.
name: Branch tests

on:
  push:
    branches-ignore: [master, ci]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Push ветки и ее PR приходят двумя событиями на один и тот же код — группа по имени ветки
# оставляет один прогон, а новый push отменяет недоделанный старый.
concurrency:
  group: branch-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Avalonia стенда иначе пробует отправить телеметрию сборки — сеть раннеру для этого не нужна.
  AVALONIA_TELEMETRY_OPTOUT: '1'
  # Культура как у пользователей: тесты форматирования ждут запятую в числах (SizesTests).
  # .NET берет культуру из LANG через ICU, системная локаль раннеру для этого не нужна.
  LANG: ru_RU.UTF-8

# bash -eo pipefail: без pipefail код возврата конвейера брался бы от последней команды.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Тесты и стенд экранов (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # cache не включаем — по той же причине, что в build.yml: он перебивает globalPackagesFolder
      # из nuget.config, и поведение разошлось бы с локальным.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Модульные тесты
        run: dotnet test Tests/Unit --configuration Release --logger 'console;verbosity=minimal'

      - name: Интеграционные тесты
        run: dotnet test Tests/Integration --configuration Release --logger 'console;verbosity=minimal'

      # Живая Avalonia без экрана: первый запуск, лента, поиск, панель чтения, настройки, темная
      # тема. Расхождение — код возврата 1, и job краснеет. Кадры экранов — вложением прогона.
      - name: Стенд экранов
        run: dotnet run --project Tests/Screens --configuration Release -- screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/*.png
          if-no-files-found: ignore
          retention-days: 7
